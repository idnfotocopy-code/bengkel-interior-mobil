plugins { id 'com.android.application' }

def cfg = new Properties()
def cfgFile = rootProject.file('config.properties')
if (cfgFile.exists()) cfgFile.withInputStream { cfg.load(it) }
// Bisa ditimpa saat build: ./gradlew assembleRelease -PDEFAULT_URL=https://alamat-baru
def defaultUrl = (project.findProperty('DEFAULT_URL') ?: cfg.getProperty('DEFAULT_URL', '')).toString().replaceAll('/+$', '')
def appName = cfg.getProperty('APP_NAME', 'Bengkel Interior Mobil')

def ks = new Properties()
def ksFile = rootProject.file('keystore/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.idnindonesia.bengkelinterior'
    compileSdk 34
    defaultConfig {
        applicationId 'com.idnindonesia.bengkelinterior'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty('VERSION_CODE') ?: cfg.getProperty('VERSION_CODE', '1')).toString())
        versionName((project.findProperty('VERSION_NAME') ?: cfg.getProperty('VERSION_NAME', '1.0.0')).toString())
        resValue 'string', 'app_name', appName
        resValue 'string', 'default_url', defaultUrl
    }
    signingConfigs {
        if (ks.getProperty('storeFile')) {
            release {
                storeFile rootProject.file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}
